<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌍 Real-Time Weather Dashboard</h1>
            <p class="subtitle">Get accurate weather information instantly</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    class="search-input" 
                    placeholder="Enter city name..."
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-btn">Search</button>
            </div>
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- Current Weather Card -->
        <div id="currentWeather" class="current-weather hidden">
            <div class="weather-header">
                <div class="city-info">
                    <h2 id="cityName" class="city-name"></h2>
                    <p id="updateTime" class="update-time"></p>
                </div>
                <div class="weather-icon-main">
                    <div id="weatherDescription" class="weather-description"></div>
                </div>
            </div>

            <div class="temperature-section">
                <div class="main-temp">
                    <span id="temperature" class="temperature"></span>
                    <span class="unit">°C</span>
                </div>
                <div class="temp-range">
                    <div class="temp-item">
                        <span class="label">Feels Like</span>
                        <span id="feelsLike" class="value"></span>
                    </div>
                    <div class="temp-item">
                        <span class="label">High/Low</span>
                        <span id="tempRange" class="value"></span>
                    </div>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-card">
                    <div class="detail-icon">💧</div>
                    <div class="detail-content">
                        <span class="detail-label">Humidity</span>
                        <span id="humidity" class="detail-value"></span>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">💨</div>
                    <div class="detail-content">
                        <span class="detail-label">Wind Speed</span>
                        <span id="windSpeed" class="detail-value"></span>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">🔽</div>
                    <div class="detail-content">
                        <span class="detail-label">Pressure</span>
                        <span id="pressure" class="detail-value"></span>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">👁️</div>
                    <div class="detail-content">
                        <span class="detail-label">Visibility</span>
                        <span id="visibility" class="detail-value"></span>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">☁️</div>
                    <div class="detail-content">
                        <span class="detail-label">Cloud Cover</span>
                        <span id="cloudCover" class="detail-value"></span>
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">⚡</div>
                    <div class="detail-content">
                        <span class="detail-label">UV Index</span>
                        <span id="uvIndex" class="detail-value"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hourly Forecast -->
        <div id="hourlyForecast" class="hourly-forecast hidden">
            <h3>Hourly Forecast</h3>
            <div id="hourlyContainer" class="hourly-container"></div>
        </div>

        <!-- Weekly Forecast -->
        <div id="weeklyForecast" class="weekly-forecast hidden">
            <h3>7-Day Forecast</h3>
            <div id="weeklyContainer" class="weekly-container"></div>
        </div>

        <!-- No Data Message -->
        <div id="noData" class="no-data">
            <p>🌤️ Start by searching for a city to view weather data</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
